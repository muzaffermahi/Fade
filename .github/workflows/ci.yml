name: Fade candidate checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_url:
        description: HTTPS URL of the exact candidate archive
        required: true
        type: string
      candidate_sha256:
        description: Recorded candidate SHA256
        required: true
        type: string
      previous_url:
        description: HTTPS URL of the actual previous-version archive
        required: true
        type: string
      previous_sha256:
        description: Recorded previous archive SHA256
        required: true
        type: string
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PI_OFFLINE: '1'
      PI_SKIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-14
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/verify.mjs
      - name: Source render timing (synthetic; not physical/provider qualification)
        run: node --import tsx scripts/performance.ts
  artifact:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PI_OFFLINE: '1'
      PI_SKIP_VERSION_CHECK: '1'
      FADE_CANDIDATE_URL: ${{ inputs.candidate_url }}
      FADE_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      FADE_PREVIOUS_URL: ${{ inputs.previous_url }}
      FADE_PREVIOUS_SHA256: ${{ inputs.previous_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Download and verify supplied archives, then qualify actual installed bytes
        run: node scripts/qualification-artifact.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: fade-qualification-${{ matrix.os }}-node${{ matrix.node }}
          path: output/artifact-qualification.json
          if-no-files-found: error
